name: Build Zyno Voice APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Zyno Voice APK
        run: gradle assembleDebug

      - name: Prepare Zyno-Voice.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Zyno-Voice.apk

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Zyno-Voice.apk --clobber
          else
            gh release create latest Zyno-Voice.apk \
              --title "Zyno Voice Latest APK" \
              --notes "Direct APK download for Zyno Voice. Tap Zyno-Voice.apk below to download and install."
          fi

      - name: Upload Zyno Voice APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zyno-Voice-apk
          path: Zyno-Voice.apk
