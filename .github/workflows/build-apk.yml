name: Build Zyno Voice APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure debug keystore exists for CI build
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare direct APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk Zyno-Voice.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Zyno Voice Latest APK
          body: Direct APK download for Zyno Voice. Tap Zyno-Voice.apk below to download and install.
          files: Zyno-Voice.apk

      - name: Upload Zyno Voice APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zyno-Voice-apk
          path: Zyno-Voice.apk
